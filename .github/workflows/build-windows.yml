name: Build TL TRIGGER (Windows VST3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/TLTrigger_artefacts/Release/VST3/TL TRIGGER.vst3" "dist/TL TRIGGER.vst3"
          Compress-Archive -Path "dist/TL TRIGGER.vst3" -DestinationPath "TL-TRIGGER-win64-vst3.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL-TRIGGER-win64-vst3
          path: TL-TRIGGER-win64-vst3.zip

      - name: Publish release (only on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TL-TRIGGER-win64-vst3.zip
